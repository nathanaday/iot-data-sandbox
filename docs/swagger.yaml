basePath: /
definitions:
  data.CreateLayerRequest:
    properties:
      name:
        type: string
    type: object
  data.CreateProjectRequest:
    properties:
      name:
        type: string
    type: object
  data.DataFrameListResponse:
    properties:
      dataframes:
        items:
          $ref: '#/definitions/data.DataFrameMetadata'
        type: array
    type: object
  data.DataFrameMetadata:
    properties:
      created_at:
        type: string
      dataframe_id:
        type: integer
      description:
        type: string
      end_time:
        type: string
      name:
        type: string
      project_id:
        type: integer
      row_count:
        type: integer
      start_time:
        type: string
    type: object
  data.DataPoint:
    properties:
      timestamp:
        type: string
      value:
        type: number
    type: object
  data.DataQueryResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/data.DataPoint'
        type: array
      end_time:
        type: string
      row_count:
        type: integer
      start_time:
        type: string
    type: object
  data.DataSourceMetadata:
    properties:
      data_source_id:
        type: integer
      end_time:
        type: string
      name:
        type: string
      row_count:
        type: integer
      start_time:
        type: string
      time_label:
        type: string
      type:
        type: string
      value_label:
        type: string
      when_created:
        type: string
    type: object
  data.DuplicateLayerRequest:
    properties:
      new_name:
        type: string
    type: object
  data.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  data.JobStatusResponse:
    properties:
      completed_at:
        type: string
      created_at:
        type: string
      error:
        type: string
      job_id:
        type: string
      layers:
        items:
          $ref: '#/definitions/data.LayerStatusDetail'
        type: array
      project_id:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
  data.LayerListResponse:
    properties:
      layers:
        items:
          $ref: '#/definitions/data.LayerResponse'
        type: array
    type: object
  data.LayerResponse:
    properties:
      color:
        type: string
      data_layer_id:
        type: integer
      dataframe_id:
        type: integer
      is_visible:
        type: boolean
      name:
        type: string
      project_id:
        type: integer
      z_index:
        type: integer
    type: object
  data.LayerStatusDetail:
    properties:
      layer_name:
        type: string
      percent_complete:
        type: number
      rows_written:
        type: integer
      status:
        type: string
      total_rows:
        type: integer
    type: object
  data.PreviewDataResponse:
    properties:
      end_time:
        type: string
      row_count:
        type: integer
      start_time:
        type: string
      time_label:
        type: string
      type:
        type: string
      value_label:
        type: string
    type: object
  data.ProjectListResponse:
    properties:
      projects:
        items:
          $ref: '#/definitions/data.ProjectResponse'
        type: array
    type: object
  data.ProjectResponse:
    properties:
      layer_count:
        type: integer
      name:
        type: string
      project_id:
        type: integer
      when_created:
        type: string
    type: object
  data.UpdateColorRequest:
    properties:
      color:
        type: string
    type: object
  data.UpdateVisibilityRequest:
    properties:
      is_visible:
        type: boolean
    type: object
  data.UploadJobResponse:
    properties:
      job_id:
        type: string
    type: object
  data.UploadResponse:
    properties:
      created_at:
        type: string
      dataframe_id:
        type: integer
      end_time:
        type: string
      name:
        type: string
      row_count:
        type: integer
      start_time:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  tools.ParameterDefinition:
    properties:
      description:
        type: string
      name:
        type: string
      required:
        type: boolean
      type:
        type: string
    type: object
  tools.ToolCategory:
    enum:
    - analysis
    - filter
    - transform
    - ai
    - other
    type: string
    x-enum-varnames:
    - CategoryAnalysis
    - CategoryFilter
    - CategoryTransform
    - CategoryAI
    - CategoryOther
  tools.ToolManifest:
    properties:
      category:
        $ref: '#/definitions/tools.ToolCategory'
      description:
        type: string
      documentation:
        type: string
      examples:
        items:
          type: string
        type: array
      name:
        type: string
      parameters:
        items:
          $ref: '#/definitions/tools.ParameterDefinition'
        type: array
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
  description: |-
    API for managing and querying time series data from IoT sensors

    This API allows you to upload CSV files containing time series data,
    organize data in projects and layers, and query the data with time range filters.
    All data is stored in SQLite with no external file dependencies.

    Supported timestamp formats: ISO8601, RFC3339, Unix timestamps (seconds/milliseconds), Julian Day
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: IoT Data Sandbox API
  version: "1.0"
paths:
  /api/dataframes:
    get:
      description: Get a list of all registered dataframes with their metadata
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.DataFrameListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: List all dataframes
      tags:
      - dataframes
    post:
      consumes:
      - multipart/form-data
      description: Upload a CSV file containing time series data. The CSV must have
        'timestamp' column and one or more value columns. Supports various timestamp
        formats (ISO8601, Unix, Julian Day). Data is stored directly in SQLite.
      parameters:
      - description: CSV file to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Name for the dataframe (defaults to filename)
        in: formData
        name: name
        type: string
      - description: Project ID to associate the dataframe with
        in: formData
        name: project_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/data.UploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Upload a CSV dataframe
      tags:
      - dataframes
  /api/dataframes/{id}:
    delete:
      description: Delete a dataframe and its associated data table
      parameters:
      - description: DataFrame ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Delete a dataframe
      tags:
      - dataframes
    get:
      description: Get metadata for a specific dataframe by ID
      parameters:
      - description: DataFrame ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.DataFrameMetadata'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Get dataframe metadata
      tags:
      - dataframes
  /api/layers/{id}:
    delete:
      description: Delete a layer by ID
      parameters:
      - description: Layer ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Delete a layer
      tags:
      - layers
    get:
      description: Get a specific layer by ID
      parameters:
      - description: Layer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.LayerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Get layer details
      tags:
      - layers
  /api/layers/{id}/color:
    put:
      consumes:
      - application/json
      description: Update the display color of a layer
      parameters:
      - description: Layer ID
        in: path
        name: id
        required: true
        type: integer
      - description: Color value (hex format)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/data.UpdateColorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.LayerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Update layer color
      tags:
      - layers
  /api/layers/{id}/data:
    get:
      description: Get the time series data points for a layer (includes data from
        associated datasource)
      parameters:
      - description: Layer ID
        in: path
        name: id
        required: true
        type: integer
      - description: Start time in RFC3339 format (e.g., 2024-01-01T00:00:00Z)
        in: query
        name: start_time
        type: string
      - description: End time in RFC3339 format (e.g., 2024-01-01T23:59:59Z)
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.DataQueryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Get layer time series data
      tags:
      - layers
  /api/layers/{id}/data/metadata:
    get:
      description: Get metadata about the data source associated with a layer
      parameters:
      - description: Layer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.DataSourceMetadata'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Get layer data source metadata
      tags:
      - layers
  /api/layers/{id}/duplicate:
    post:
      consumes:
      - application/json
      description: Create a copy of a layer with a new name
      parameters:
      - description: Layer ID
        in: path
        name: id
        required: true
        type: integer
      - description: New layer name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/data.DuplicateLayerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/data.LayerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Duplicate a layer
      tags:
      - layers
  /api/layers/{id}/load-csv:
    post:
      consumes:
      - multipart/form-data
      description: Upload and load a CSV file into the layer (creates a new datasource).
        The CSV must have 'timestamp' and 'value' columns.
      parameters:
      - description: Layer ID
        in: path
        name: id
        required: true
        type: integer
      - description: CSV file to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Name for the datasource (defaults to filename)
        in: formData
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.LayerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Load CSV data into layer
      tags:
      - layers
  /api/layers/{id}/visibility:
    put:
      consumes:
      - application/json
      description: Update the visibility state of a layer
      parameters:
      - description: Layer ID
        in: path
        name: id
        required: true
        type: integer
      - description: Visibility state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/data.UpdateVisibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.LayerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Update layer visibility
      tags:
      - layers
  /api/projects:
    get:
      description: Get a list of all projects
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.ProjectListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: List all projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new empty project
      parameters:
      - description: Project details
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/data.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/data.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Create a new project
      tags:
      - projects
  /api/projects/{id}:
    delete:
      description: Delete a project and all its layers (cascade)
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Delete a project
      tags:
      - projects
    get:
      description: Get a specific project by ID with layer count
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Get project details
      tags:
      - projects
  /api/projects/{id}/layers:
    get:
      description: Get all layers that belong to a specific project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.LayerListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Get all layers in a project
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new layer and add it to the project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Layer details
        in: body
        name: layer
        required: true
        schema:
          $ref: '#/definitions/data.CreateLayerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/data.LayerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Add a layer to a project
      tags:
      - projects
  /api/projects/{id}/load-csv:
    post:
      consumes:
      - multipart/form-data
      description: 'Upload a multi-column CSV file asynchronously. Returns a job ID
        immediately. Creates separate DataFrames and layers for each value column
        (non-timestamp). For example, a CSV with columns (ts, humidity, smoke, temp)
        will create three layers: humidity, smoke, and temp. Use GET /api/projects/{id}/load-csv/status?job={job_id}
        to check progress.'
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: CSV file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/data.UploadJobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Load multi-column CSV into project (async)
      tags:
      - projects
  /api/projects/{id}/load-csv/status:
    get:
      description: Check the progress of an async CSV upload job by job ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Job ID
        in: query
        name: job
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.JobStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Get CSV upload job status
      tags:
      - projects
  /api/tools:
    get:
      description: Use the ToolHandler and ToolCallService to fetch all registered
        tools from "internal/tools" Go path
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/tools.ToolManifest'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Fetch all tools from the Tool module
      tags:
      - tools
  /api/ui/preview_data:
    post:
      consumes:
      - multipart/form-data
      description: Upload and preview a CSV file to see metadata without creating
        a datasource or saving the file
      parameters:
      - description: CSV file to preview
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.PreviewDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.ErrorResponse'
      summary: Preview CSV data before saving
      tags:
      - ui
swagger: "2.0"
